name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install
        run: |
          corepack enable
          yarn install
      - name: Type-check and build
        run: yarn build
      - name: Lint
        run: yarn lint
      - name: Package
        run: yarn companion-module-build
